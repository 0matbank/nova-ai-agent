# Personal AI Agent OS — main non-secret configuration (plan §17G).
# Secrets never go here: they live in <secrets_dir>/.env (see .env.example).

agent:
  name: "Nova AI"
  timezone: "Asia/Dhaka"
  languages: [bn, en, banglish]

# Runtime folders are resolved relative to `paths.root`. `root: null` means
# "parent of the app/ repo folder" (i.e. D:\Personal-Agent). The env var
# PERSONAL_AGENT_ROOT overrides it. All runtime data stays outside the repo (§23).
paths:
  root: null
  data_dir: data
  database: data/agent.db
  secrets_dir: secrets
  sessions_dir: sessions
  workspace_dir: workspace
  downloads_dir: downloads
  logs_dir: logs
  backups_dir: backups
  local_models_dir: local-models

logging:
  level: INFO
  format: json
  rotation:
    max_bytes: 10485760   # 10 MB per file
    backup_count: 10
  categories: [core, desktop, browser, provider, tasks, audit]   # §17E

# §28 — routine progress throttle. Critical messages are always exempt.
notification_throttle:
  min_progress_interval_seconds: 30
  soft_max_progress_updates_per_task: 5
  repeated_error_cooldown_seconds: 300
  batch_small_results: true
  exempt_message_types:
    - approval_required
    - user_input_required
    - critical_security_alert
    - task_completed
    - task_failed_permanently
    - agent_going_offline
    - recovery_after_restart

# §26/§29 — task engine
task_engine:
  max_retries: 2              # failed verification / step error → RETRYING, then FAILED
  idle_poll_seconds: 5
  list_limit: 10              # rows shown by /tasks

# §7 — voice commands
voice:
  max_duration_seconds: 300
  # Below this transcription confidence the agent shows what it heard (plus a
  # suggested correction) and waits for ✅ — it never guesses (plan §7; owner
  # feedback 2026-09-24: first phone test ran a misheard Bangla command at 67%).
  confirm_below_confidence: 0.85
  # Read-only requests (PC status, screenshot, process list, plain questions)
  # cannot do harm if misheard, so they need less certainty.
  confirm_below_confidence_safe: 0.5
  confirm_timeout_seconds: 300
  keep_audio: false            # delete the audio file after transcription
  beam_size: 5
  vad_speech_pad_ms: 400       # keep short commands from being clipped
  # Vocabulary hint for Whisper (initial prompt): words the owner often says.
  # Spoken replies (plan §57 optional TTS): when the owner speaks, Nova answers in
  # voice too (text is always sent as well). Engine: Microsoft neural voices via
  # edge-tts (online; the reply text is sent to Microsoft to be spoken).
  tts:
    enabled: true
    voices: {bn: bn-BD-NabanitaNeural, en: en-US-AvaMultilingualNeural}
    max_chars: 1200
    rate: "-8%"                  # a little slower = clearer (owner feedback 2026-09-25)
  hint_words: [Nova AI, পিসি, পিসির অবস্থা, স্ট্যাটাস, স্ক্রিনশট, screenshot, status,
               বাংলাদেশ, রাজধানী, খোলো, বন্ধ করো, ফাইল, ফোল্ডার, Notepad, Chrome,
               Click TV, টাস্ক, বলো, দেখাও]

# §32A — graceful shutdown
shutdown:
  graceful_timeout_seconds: 30
  worker_kill_after_seconds: 15
