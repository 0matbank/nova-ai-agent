# Permission levels (plan §18). Enforced by the Permission Engine (Phase 4).
#   GREEN  = automatic
#   BLUE   = automatic + log
#   YELLOW = safety check
#   RED    = explicit approval required (single task/action, never reused)

default_level: RED   # unknown actions are treated as RED (fail closed)

approval:
  timeout_seconds: 300
  single_use: true
  require_totp_for: []   # optional §17D secondary confirmation, e.g. [admin_action]

actions:
  file.read: GREEN
  search: GREEN
  screenshot: GREEN
  pc.status: GREEN
  research: GREEN
  process.list: GREEN
  powershell.read: GREEN      # only parser-verified read-only commands (skills/powershell)
  terminal.read: GREEN        # only allowlisted read-only programs (skills/terminal)

  file.create: BLUE
  file.move: BLUE             # destination must not exist; otherwise file.overwrite
  file.delete_workspace: BLUE # inside the agent's own workspace only
  app.open: BLUE
  app.close: BLUE             # graceful close; the app may still ask to save
  browser.navigate: BLUE
  test.run: BLUE
  download: BLUE

  file.overwrite: YELLOW      # safety check = backup made first
  file.organize: YELLOW       # safety check = no collisions, nothing protected
  package.install: YELLOW
  git.commit: YELLOW
  config.change: YELLOW

  powershell.run: RED         # any command not proven read-only
  terminal.run: RED
  process.kill: RED

  file.delete_important: RED
  file.delete_pathwide: RED
  git.push_production: RED
  message.send_external: RED
  system.shutdown: RED
  system.restart: RED
  account.security_change: RED
  admin.destructive: RED
