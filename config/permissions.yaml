# Permission levels (plan §18). Enforced by the Permission Engine (Phase 4).
#   GREEN  = automatic
#   BLUE   = automatic + log
#   YELLOW = safety check
#   RED    = explicit approval required (single task/action, never reused)

default_level: RED   # unknown actions are treated as RED (fail closed)

approval:
  timeout_seconds: 300
  single_use: true
  require_totp_for: []   # optional §17D secondary confirmation, e.g. [admin_action]

actions:
  file.read: GREEN
  git.read: GREEN             # status / diff of a registered project
  search: GREEN
  screenshot: GREEN
  pc.status: GREEN
  research: GREEN
  process.list: GREEN
  powershell.read: GREEN      # only parser-verified read-only commands (skills/powershell)
  terminal.read: GREEN        # only allowlisted read-only programs (skills/terminal)
  device.read: GREEN          # V1.2: volume / brightness level
  device.control: BLUE        # V1.2: volume, mute, media keys, brightness (reversible)
  ui.read: GREEN              # list windows, inspect controls, read a value
  browser.read: GREEN         # snapshot, find text, page screenshot — content is untrusted
  clipboard.read: GREEN       # content is untrusted + redacted

  file.create: BLUE
  file.move: BLUE             # destination must not exist; otherwise file.overwrite
  file.delete_workspace: BLUE # inside the agent's own workspace only
  app.open: BLUE
  app.close: BLUE             # graceful close; the app may still ask to save
  browser.fill: BLUE          # typing into a field (not submitting)
  ui.focus: BLUE
  ui.type: BLUE               # appends; never replaces existing content
  clipboard.write: BLUE
  browser.navigate: BLUE
  browser.select: BLUE        # choosing a dropdown option (not submitting)
  test.run: BLUE
  download: BLUE
  git.pull: BLUE              # fast-forward only, clean tree only

  file.overwrite: YELLOW      # safety check = backup made first
  file.organize: YELLOW       # safety check = no collisions, nothing protected
  ui.click: YELLOW            # safety check = control name has no danger word
  ui.keys: YELLOW             # safety check = not a closing/deleting shortcut
  ui.replace_text: YELLOW     # safety check = previous content backed up
  browser.click: YELLOW       # safety check = element text has no danger word (buy/pay/send…)
  browser.submit: YELLOW      # safety check = it is a search box; any other form → approval
  browser.click_xy: YELLOW    # vision click; safety check = element at the point is
                              # identified and has no danger word, else approval
  package.install: YELLOW
  git.commit: YELLOW
  code.edit: YELLOW           # AI coding agent (Codex) edits a project folder; safety check =
                              # allowed project folder + clean git tree, else approval
  config.change: YELLOW

  powershell.run: RED         # any command not proven read-only
  terminal.run: RED
  process.kill: RED
  ui.shell_input: RED         # typing/clicking/keys into a terminal or Run dialog
  ui.type_secret: RED         # typing into a password field (the app marks it; any app)
  ui.click_xy: RED            # raw coordinates: last resort (plan §15, §17)
  browser.fill_secret: RED    # typing into a password field

  file.delete_important: RED
  file.delete_pathwide: RED
  file.move_pathwide: RED      # moving a whole folder from outside the workspace / a project
  git.push_production: RED
  git.push: RED               # every push asks the owner (nova/... branches only)
  message.send_external: RED
  system.shutdown: RED
  system.restart: RED
  account.security_change: RED
  admin.destructive: RED

  # Phase 22 Privileged/Admin Broker — the broker itself re-checks every RED approval
  admin.status: GREEN         # broker status, a service's state, Nova's firewall rules
  admin.power_cancel: GREEN   # cancelling a scheduled restart/shutdown is always safe
  admin.service_control: RED  # start/stop/restart an allowlisted Windows service
  admin.firewall: RED         # add/remove a "Nova AI - …" firewall rule
  admin.package_install: RED  # winget install (machine-wide, elevated)
  admin.package_uninstall: RED
  admin.task: RED             # an allowlisted fixed elevated command

  # Phase 23: /update installs new commits from the owner's repo (with rollback)
  system.self_update: RED
