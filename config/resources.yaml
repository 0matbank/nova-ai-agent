# Resource Manager thresholds (plan §17H), tuned for a 16 GB RAM PC.

monitor_interval_seconds: 30

ram_percent:
  moderate: 70
  high: 85
  critical: 93

vram_percent:
  high: 85
  critical: 95

disk_free_gb_min: 20

idle_unload_seconds:
  # V1.1 warm-idle: a cold Whisper load costs ~25 s, so it stays loaded 20 min after the
  # last voice note — but only 60 s at "high" memory pressure and not at all at
  # "critical" (core/voice/transcriber.py idle_limit)
  whisper: 1200
  ollama: 600

actions:
  high: [close_idle_browser_tabs, pause_low_priority_workers]
  critical: [unload_unused_ollama_models, unload_idle_whisper, route_heavy_local_to_cloud, notify_user]
