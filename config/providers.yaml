# AI provider pool (plan §8). There is NO global "main AI" — routing is
# task-type based. Model names are never hard-coded here; each provider points
# at an alias set in models.yaml.
#
# enabled: true | false | optional   (optional = adapter available, off until configured)
# mode:    subscription | api | subscription_or_api | local

providers:
  openai_codex:
    enabled: true
    mode: subscription
    model_alias_set: openai_codex
    priority:
      coding: 100
      review: 80

  google_antigravity:
    enabled: true
    mode: subscription
    model_alias_set: google_antigravity
    priority:
      coding: 90
      reasoning: 100
      review: 90
      summarization: 80           # owner 2026-09-26: Gemini API → Antigravity → local Qwen
      planning: 60                # browser planner backup (owner 2026-09-26: local first)
      # Questions (owner 2026-10-15): quick → local first; numbers/dates → Gemini first;
      # current/live facts → Antigravity first (it may use Google search for these only).
      quick_answer: 80
      fact_check: 90
      current_info: 100

  gemini_api:
    enabled: true                 # owner 2026-09-25: primary for Bangla page summaries
    mode: api
    free_tier_only: true          # free-tier key; quota/errors → local fallback, no billing
    model_alias_set: gemini_api
    priority:
      summarization: 100
      vision: 60                  # fallback after local qwen3-vl (owner: local first)
      reasoning: 85               # API fallback after Antigravity (plan §8.3; free tier only)
      quick_answer: 90            # when local Qwen is unsure or down
      fact_check: 100             # exact numbers / dates / statistics — fast cloud check
      current_info: 80

  anthropic_claude:
    enabled: false
    mode: subscription_or_api
    model_alias_set: anthropic_claude
    priority:
      coding: 85                  # owner order: Codex → Antigravity → Claude → local
      reasoning: 95
      review: 100

  ollama_local:
    enabled: true
    mode: local
    model_alias_set: ollama_models
    priority:
      simple: 100
      offline: 100
      vision: 100                 # local qwen3-vl first — screenshots stay on this PC
      planning: 100               # browser agent steps: local first (owner 2026-09-26)
      quick_answer: 100           # short simple questions: ~2–3 s, nothing leaves the PC
      fallback: 70

# §8.6 circuit breaker
circuit_breaker:
  transient_failure_threshold: 3
  cooldown_backoff_minutes: [10, 20, 30]

# §8.7 error-based switching
retry:
  timeout_retries: 1
  server_error_retries: 2

# §58 token / context control: how long and how much output each task type may use.
# Change here — never in code (the router applies these to every request).
task_budgets:
  intent_classification: {timeout_seconds: 60, max_output_tokens: 60}
  simple:                {timeout_seconds: 45, max_output_tokens: 120}    # e.g. voice wording fix
  quick_answer:          {timeout_seconds: 120, max_output_tokens: 400}
  fact_check:            {timeout_seconds: 120, max_output_tokens: 600}
  current_info:          {timeout_seconds: 180, max_output_tokens: 800}
  reasoning:             {timeout_seconds: 180, max_output_tokens: 800}
  planning:              {timeout_seconds: 180, max_output_tokens: 500}
  summarization:         {timeout_seconds: 60, max_output_tokens: 1400}
  vision:                {timeout_seconds: 90, max_output_tokens: 2000}   # qwen3-vl always thinks
  coding:                {timeout_seconds: 1200, max_output_tokens: 4000}
  review:                {timeout_seconds: 600, max_output_tokens: 2000}

# §9 budget guard: API-billed providers must be explicitly allowed.
budget_guard:
  allow_paid_api_usage: false
