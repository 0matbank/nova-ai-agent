# Specialist agent roster (plan §12, §50). Agents define HOW to think; skills do
# the work (§11). Agents are provider-neutral (§8.11): an agent names the KIND of
# AI work (provider_task_type) and the provider router picks today's provider.
# Only a few are active per request (§58, §61): lead + project specialist + verifier.
#
# provider_task_type: the task type the provider router routes this agent's AI
#                     calls by (null = deterministic, no AI of its own)
# skills:             the ONLY skills this agent may call — "skill" or "skill.tool";
#                     enforced by the SkillRunner on top of the permission levels
# Role prompts: agents/<name>/AGENT.md

runtime:
  max_active_agents_per_task: 3

agents:
  master_orchestrator: { enabled: true, kind: reasoning, task_types: [all, question],
                         provider_task_type: quick_answer, skills: [] }
  windows_operator:    { enabled: true, kind: reasoning,
                         task_types: [pc_control, pc_status, screenshot, processes],
                         provider_task_type: planning,
                         skills: [windows, app-control, desktop-ui, screenshot, clipboard,
                                  powershell, terminal, files.list_dir, files.metadata,
                                  files.read_text, search] }
  developer:           { enabled: true, kind: reasoning, task_types: [coding],
                         provider_task_type: coding, skills: [git] }
  frontend_ui:         { enabled: true, kind: reasoning, task_types: [coding, frontend],
                         provider_task_type: coding, skills: [git] }
  android:             { enabled: true, kind: reasoning, task_types: [coding, android],
                         provider_task_type: coding, skills: [git] }
  backend_architect:   { enabled: true, kind: reasoning, task_types: [coding, backend],
                         provider_task_type: coding, skills: [git] }
  browser:             { enabled: true, kind: reasoning, task_types: [browser],
                         provider_task_type: planning,
                         skills: [browser, browser-vision, download] }
  research:            { enabled: true, kind: reasoning, task_types: [research],
                         provider_task_type: current_info, skills: [] }
  file_document:       { enabled: true, kind: reasoning, task_types: [document, files],
                         provider_task_type: planning,
                         skills: [files, search, download, documents, archive, image] }
  devops:              { enabled: true, kind: reasoning, task_types: [devops],
                         provider_task_type: coding, skills: [git] }
  git:                 { enabled: true, kind: reasoning, task_types: [git],
                         provider_task_type: null, skills: [git] }
  media:               { enabled: true, kind: reasoning, task_types: [media],
                         provider_task_type: planning,
                         skills: [media, image, files.list_dir, files.metadata, search.find,
                                  search.recent] }
  automation:          { enabled: true, kind: reasoning, task_types: [automation, reminder],
                         provider_task_type: null, skills: [] }
  security:            { enabled: true, kind: reasoning, task_types: [security],
                         provider_task_type: planning,
                         skills: [git.status, git.diff, search, files.list_dir,
                                  files.metadata, files.read_text] }
  verifier:            { enabled: true, kind: reasoning, task_types: [all],
                         provider_task_type: null, skills: [] }

# Plan §8.10 cross-provider review (Phase 18): a high-impact code change gets a
# read-only second opinion from a DIFFERENT provider before Nova commits it.
review:
  enabled: true
  min_changed_lines: 150      # large refactor
  min_files: 5
  roles: [security, devops, backend_architect]
  keywords: [production, security, secure, refactor, deploy, release, critical, important,
             payment, auth, review, double check, second opinion, ভালো করে দেখ]
  path_patterns: [Dockerfile, "docker-compose*", ".github/workflows/*", "*.tf", "deploy*",
                  "*.env.example", "*auth*", "*security*"]
  max_fix_rounds: 1           # the implementer fixes the reviewer's blocking issues once

# Project specialists (plan §13, §51, §52): agents/projects/<key>/AGENT.md plus the
# profile in config/projects/<key>.yaml (same key). One without a profile stays
# inactive until its profile is added.
project_agents: [click-tv, stream-doctor, git-demo, social-selling, website-development, seo]
