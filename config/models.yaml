# Role-based model aliases (plan §8.3, §9A). Change models here — never in code.
# `null` = let the provider CLI/account use its own default model.

ollama_models:
  fast_general: "qwen3:8b"
  intent_classification: "qwen3:8b"
  summarization: "qwen3:8b"
  bangla_banglish: "qwen3:8b"
  local_code_review: "deepseek-coder-v2:16b"

ollama_policy:
  default_alias: fast_general
  on_demand_aliases: [local_code_review]   # loaded only when coding/review needs it
  max_heavy_models_loaded: 1
  idle_unload_seconds: 600
  # Benchmark 2026-09-24 (scripts/benchmark_local_models.py): qwen3:8b scored
  # 7/10 on Bangla facts without thinking vs 10/10 with it (~3.8 s avg).
  # Fast paths (intent, simple) stay without thinking.
  think_task_types: [reasoning, bangla, coding, review, summarization]

# Speech-to-text (plan §7). Loaded on demand, unloaded when idle (resources.yaml).
whisper:
  model: large-v3
  path: local-models/whisper/large-v3     # relative to the runtime root
  device: cuda                            # falls back to cpu/int8 if CUDA fails
  compute_type: float16

openai_codex:
  default: null

google_antigravity:
  default: null

gemini_api:
  default: null
  tts: "gemini-3.8-flash-tts"      # spoken replies (verified in Google docs 2026-09-25)

anthropic_claude:
  default: null
