[project]
name = "nova-ai-agent"
version = "0.1.0"
description = "Nova AI — Personal AI Agent OS: remotely controllable, permission-controlled Windows agent"
readme = "README.md"
requires-python = "==3.12.*"
# Base dependencies = the "core" group (Core Service). Worker-specific
# dependencies live in the optional groups below and are added in the phase
# that first needs them.
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "psutil>=6,<8",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "tzdata>=2024.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pywin32>=306 ; sys_platform == 'win32'",
    "send2trash>=1.8,<2",
]

[project.optional-dependencies]
desktop = [
    "mss>=9,<11",
    "pillow>=10,<13",
    "uiautomation>=2.0.20,<3 ; sys_platform == 'win32'",
]
browser = []
voice = [
    "edge-tts>=7,<8",
    "faster-whisper>=1.1,<2",
    "nvidia-cublas-cu12>=12.4,<13 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'win32'",
]
local-ai = []

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "types-psutil>=7.2.2.20260906",
    "types-pywin32>=312.0.0.20260827",
]
test = [
    "pytest>=8.3",
]

[tool.uv]
package = false
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "skills"]
addopts = "-ra --strict-markers"
markers = [
    "windows: requires a real Windows desktop session",
    "e2e: local Windows end-to-end test (not run in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108", "S603"]
"scripts/verify_foundation.py" = ["S603", "S607"]
"migrations/versions/**" = ["E501"]   # Alembic-generated
# UIA pattern probing: "pattern not supported" arrives as an exception by design.
"workers/desktop-worker/desktop_ui.py" = ["S112"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^tests/", "^docs/"]

[[tool.mypy.overrides]]
# types-pywin32 types CreateFile's PyHANDLE and ReadFile's bytes result wrongly;
# runtime behaviour is covered by tests/integration/test_broker_pipe.py.
module = "core.ipc.pipe"
disable_error_code = ["arg-type", "call-overload"]
