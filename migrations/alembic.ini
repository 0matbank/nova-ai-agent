# Alembic config (plan §21A). The database URL is NOT stored here — env.py
# resolves it from config/default.yaml (paths.database), or uses the
# connection handed over by core.db.migrate.
#
# New migration:
#   uv run alembic -c migrations/alembic.ini revision --autogenerate --rev-id 002 -m provider_history

[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
